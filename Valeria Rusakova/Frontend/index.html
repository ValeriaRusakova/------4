<!doctype html>
<!-- lang="he" + dir="rtl": the whole site is Hebrew, right-to-left (also helps screen readers) -->
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ValGPT - צ'אט AI חכם בעברית" />
    <title>ValGPT</title>

    <!-- Rubik: a clear, modern font that supports Hebrew -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Apply the saved light/dark mode before the page is drawn (prevents a white flash) -->
    <script>
      try {
        var saved = JSON.parse(localStorage.getItem("valgpt-settings")) || {};
        var prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        document.documentElement.dataset.theme = saved.theme || (prefersDark ? "dark" : "light");
      } catch (error) {}
    </script>
  </head>
  <body>
    <!-- React draws the whole app inside this div -->
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
